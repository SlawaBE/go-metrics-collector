# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  EXE:
    sh: go env GOOS | grep -q windows && echo .exe || echo ""
  SERVER_BINARY: cmd/server/server{{.EXE}}
  AGENT_BINARY: cmd/agent/agent{{.EXE}}
  HASHER_BINARY: cmd/hasher/hasher{{.EXE}}
  STATICTEST_BINARY: statictest{{.EXE}}
  LOG_DIR: logs
  TEMP_FILE: tempfile
  AUDIT_FILE: audit.log

tasks:
  clean:
    desc: Clean
    cmds:
      - rm -f {{.SERVER_BINARY}}
      - rm -f {{.AGENT_BINARY}}
      - rm -f {{.HASHER_BINARY}}
      - rm -rf {{.LOG_DIR}}
      - rm -f {{.TEMP_FILE}}
      - rm -f {{.AUDIT_FILE}}

  build-server:
    desc: Build server
    cmds:
      - go build -o {{.SERVER_BINARY}} ./cmd/server/
    sources:
      - "**/*.go"
    generates:
      - "{{.SERVER_BINARY}}"

  build-agent:
    desc: Build agent
    cmds:
      - go build -o {{.AGENT_BINARY}} ./cmd/agent/
    sources:
      - "**/*.go"
    generates:
      - "{{.AGENT_BINARY}}"

  build-hasher:
    desc: Build hasher
    cmds:
      - go build -o {{.HASHER_BINARY}} ./cmd/hasher/
    sources:
      - "**/*.go"
    generates:
      - "{{.HASHER_BINARY}}"

  test:
    desc: Run tests
    cmds:
      - go test -v ./...
  
  coverage:
    desc: Calculate test coverage
    cmds:
      - go test -cover ./...

  bench:
    desc: Run benchmark tests
    cmds:
      - go test -bench=. -benchmem ./...

  vet:
    desc: Run statictest
    cmds:
      - go vet -vettool={{.STATICTEST_BINARY}} ./...

  autotest:
    desc: Run autotests
    deps: 
      - build-server
      - build-agent
    cmds:
      - bash ./autotest.sh

  build:
    desc: Build all binaries
    deps: 
      - build-server
      - build-agent

  test-all:
    desc: Run all test
    cmds:
      - task vet
      - task test
      - task autotest

  fmt:
    desc: Format
    cmds:
      - gofmt -w .
      - goimports -w .

  run-godoc:
    desc: Run godoc
    cmds:
      - godoc -http=:8080
